# Groups the auto-generated release notes (see workflows/release.yml) by PR
# label. Self-hosters click through to these from the in-app update reminder,
# so put anything they must do before upgrading in a PR labelled `breaking`.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ⚠️ Read before upgrading
      labels:
        - breaking
    - title: ✨ New
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - fix
        - bug
    - title: 🐳 Self-hosting
      labels:
        - self-hosting
        - docker
    - title: 🧹 Other changes
      labels:
        - "*"
