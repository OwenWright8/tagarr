name: CI

on:
  pull_request:
  push:
    branches:
      - main

# CI only reads the repo; no job needs a write-scoped token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The server and sync engine end to end, against fake Jellyfin and Seerr
      # servers (scripts/mock-servers.ts).
      - run: npm test

      - run: npm run build

      # Walks through the setup wizard and every page in Chromium, against the
      # same fakes, failing on any browser error.
      - name: UI smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run screenshots

  # The real image: build it, start it read-only like the compose file does,
  # and check it answers.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: autotagarr:ci

      - name: Start and probe
        run: |
          docker volume create autotagarr-ci
          docker run -d --name autotagarr --read-only --tmpfs /tmp -v autotagarr-ci:/data -p 8686:8686 -e UPDATE_CHECK=off autotagarr:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8686/api/session; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://localhost:8686/ | grep -q '<title>Autotagarr</title>'
          curl -fsS http://localhost:8686/library | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8686/api/overview)" = 401
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' autotagarr)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' autotagarr | grep -q healthy

      - name: Logs
        if: always()
        run: docker logs autotagarr || true

  # arm64 (Raspberry Pi and other ARM servers): build only, under emulation.
  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
