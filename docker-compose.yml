# Tagarr: automatic per-person tags for a shared Jellyfin library.
#
#     docker compose up -d
#
# then open http://<this-machine>:8686, create your account and connect
# Jellyfin and Seerr in the setup wizard. There is nothing to configure here:
# everything lives in the `tagarr-data` volume (back it up).
#
# Running Jellyfin and Seerr in the same compose project? Use their service
# names in the wizard (e.g. http://jellyfin:8096). Otherwise use a LAN IP.

x-logging: &default-logging
  # Docker's default json-file driver never rotates.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tagarr:
    # `docker compose up -d` pulls the prebuilt image; `docker compose up -d
    # --build` builds it from this folder instead.
    image: ${TAGARR_IMAGE_REPO:-ghcr.io/owenwright8/tagarr}:${TAGARR_VERSION:-latest}
    build:
      context: .
    container_name: tagarr
    restart: unless-stopped
    environment:
      # "off" stops the app from checking GitHub for new releases.
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
      TZ: ${TZ:-UTC}
    volumes:
      - tagarr-data:/data
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${APP_PORT:-8686}:8686"

volumes:
  tagarr-data:
